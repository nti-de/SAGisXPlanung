trigger:
 tags:
   include:
     - v2.*

jobs:
- job: build_shared
  displayName: Build common assets
  pool:
    vmImage: ubuntu-latest

  steps:
  - script: |
      python3 -m pip install --upgrade pip
      python3 -m pip install zensical
    displayName: 'Install Zensical'

  - script: |
      zensical build
    displayName: 'Build Documentation with Zensical'
    workingDirectory: docs

  - task: CopyFiles@2
    displayName: 'Copy docs into plugin'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)/docs/site'
      Contents: '**'
      TargetFolder: '$(Build.SourcesDirectory)/src/SAGisXPlanung/docs'

  - script: |
      python3 build/build.py --target-name SAGisXPlanung
    displayName: 'Build release (SAGisXPlanung)'
    workingDirectory: $(Build.SourcesDirectory)

  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: 'dist/SAGisXPlanung'
      includeRootFolder: true
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/SAGisXPlanung_$(Build.SourceBranchName).zip'
      replaceExistingArchive: true

  - script: |
      python3 build/build.py
    displayName: 'Build release (Pro Version)'
    condition: and(
        succeeded(),
        not(endsWith(variables['Build.SourceBranchName'], '-ce'))
      )
    workingDirectory: $(Build.SourcesDirectory)

  - task: ArchiveFiles@2
    displayName: 'Package release'
    condition: and(
      succeeded(),
      not(endsWith(variables['Build.SourceBranchName'], '-ce'))
      )
    inputs:
      rootFolderOrFile: 'dist/SAGisXPlanung_pro'
      includeRootFolder: true
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/SAGisXPlanung_pro_$(Build.SourceBranchName).zip'
      replaceExistingArchive: true

  - task: PublishPipelineArtifact@1
    displayName: 'Publish plugin docs'
    inputs:
      targetPath: '$(Build.SourcesDirectory)/src/SAGisXPlanung/docs'
      artifact: 'plugin-docs'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish build artifacts'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'qgis-plugins'

- job: build_variants
  displayName: Build packaged plugin
  dependsOn: build_shared
  condition: and(
      succeeded(),
      not(endsWith(variables['Build.SourceBranchName'], '-ce'))
    )
  pool:
    vmImage: ubuntu-latest

  strategy:
    matrix:
      win_cp312:
        PY_VER: "312"
        PY_ABI: "cp312"
        PLATFORM: "win_amd64"
        ARTIFACT_SUFFIX: "win_cp312"

      win_cp313:
        PY_VER: "313"
        PY_ABI: "cp313"
        PLATFORM: "win_amd64"
        ARTIFACT_SUFFIX: "win_cp313"

  steps:
  - task: DownloadPipelineArtifact@2
    displayName: 'Download plugin docs'
    inputs:
      artifact: 'plugin-docs'
      path: '$(Build.SourcesDirectory)/src/SAGisXPlanung/docs'

  - script: |
      DEP_DIR="src/SAGisXPlanung/dependencies/$(PY_ABI)"
      mkdir -p "$DEP_DIR"
  
      pip install \
        -r requirements.txt \
        --target "$DEP_DIR" \
        --platform $(PLATFORM) \
        --python-version $(PY_VER) \
        --implementation cp \
        --abi $(PY_ABI) \
        --only-binary=:all:
    displayName: 'Package Install ($(PY_ABI))'

  - script: |
      python3 build/build.py --target-name SAGisXPlanung
    displayName: 'Build release'
    workingDirectory: $(Build.SourcesDirectory)

  - task: ArchiveFiles@2
    displayName: 'Package release'
    inputs:
      rootFolderOrFile: 'dist/SAGisXPlanung'
      includeRootFolder: true
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/SAGisXPlanung_$(Build.SourceBranchName)_$(PLATFORM)-$(PY_ABI).zip'
      replaceExistingArchive: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish build artifacts'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'qgis-plugins'
