bauliche_nutzung_dachform:
  type:
    text:
      stroke: black
  name: Dachform
  attribute:
    - xpath: dachgestaltung/BP_Dachgestaltung/dachform
bauliche_nutzung_vollgeschosse:
  type:
    text:
      pattern: "{Z|roman}"
      stroke: black
  name: Maß der baulichen Nutzung/ Zahl der Vollgeschosse (Höchstmaß)
  attribute:
    - xpath: Z
bauliche_nutzung_vollgeschosse_min_max:
  type:
    text:
      pattern: "{Zmin|roman} - {Zmax|roman}"
      stroke: black
  name: Maß der baulichen Nutzung/ Zahl der Vollgeschosse (als Mindest- und Höchstmaß)
  attribute:
    - xpath:
        - Zmin
        - Zmax
      match: 'all'
bauliche_nutzung_vollgeschosse_zwingend:
